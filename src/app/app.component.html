<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer mode="side">
        <mat-nav-list>
            <a mat-list-item routerLink="/books" routerLinkActive="active-link">View All Books</a>
            <a mat-list-item routerLink="/books/add" routerLinkActive="active-link">Add New Book</a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar color="primary">
            <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle Sidenav">
                <mat-icon>menu</mat-icon>
            </button>
            <span class="center-vertically">Bookstore <mat-icon style="margin-left: 5px;">menu_book</mat-icon></span>
        </mat-toolbar>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
