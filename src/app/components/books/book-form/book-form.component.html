<mat-card class="form-card">
    <mat-card-header>
        <mat-card-title>Add/Edit Book</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Title</mat-label>
                <input matInput formControlName="title" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Isbn</mat-label>
                <input matInput formControlName="isbn" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Price</mat-label>
                <input matInput type="number" formControlName="price" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Author</mat-label>
                <mat-select formControlName="authorId">
                    <mat-option value="0" disabled>Select an author</mat-option>
                    <mat-option *ngFor="let author of authors" [value]="author.id">
                        {{author.name}}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="form-field">
                <mat-label>Category</mat-label>
                <mat-select formControlName="categoryId">
                    <mat-option value="0" disabled>Select a category</mat-option>
                    <mat-option *ngFor="let category of categories" [value]="category.id">
                        {{category.name}} ({{category.description}})
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" class="submit-button">
                Save
            </button>
        </form>
    </mat-card-content>
</mat-card>
